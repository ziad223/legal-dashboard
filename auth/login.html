<!-- login.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل الدخول | Legal Technology</title>
    <link rel="icon" type="image/png" href="../logo_legal.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="../js/tailwind-config.js"></script>
    <link rel="stylesheet" href="../css/main.css">
</head>

<body class="bg-shape min-h-screen flex items-center justify-center p-6">

    <div class="glass-card w-full max-w-md p-10">

        <div class="flex justify-center mb-10">
            <div class="bg-white rounded-[25px] p-5 shadow-soft border border-slate-50">
                <img src="../logo_legal.png" class="w-32 h-32 object-contain" alt="Legal Technology Logo">
            </div>
        </div>

        <h1 class="text-3xl font-black text-center text-[#41684e] mb-2">
            تسجيل الدخول
        </h1>

        <p class="text-center text-gray-400 text-sm font-bold mb-10">
            مرحباً بك في لوحة التحكم القانونية
        </p>

        <form id="loginForm" class="space-y-6">

            <div class="relative">
                <i
                    class="fa-solid fa-envelope absolute right-3 top-1/2 -translate-y-1/2 text-[#caa55d]"></i>

                <input type="email" id="email" placeholder="البريد الإلكتروني"
                    class="input-style" required />
            </div>

            <div class="relative">
                <i
                    class="fa-solid fa-lock absolute right-3 top-1/2 -translate-y-1/2 text-[#caa55d]"></i>

                <input type="password" id="password" placeholder="كلمة المرور"
                    class="input-style" required />
            </div>

            <div class="flex items-center justify-between text-sm">

                <label class="flex items-center gap-2 font-bold text-gray-600">
                    <input type="checkbox"
                        class="accent-[#caa55d] w-4 h-4">
                    تذكرني
                </label>

                <a href="forgot-password.html"
                    class="text-[#caa55d] font-extrabold hover:underline">
                    نسيت كلمة المرور؟
                </a>

            </div>

            <button type="submit"
                class="login-btn w-full rounded-2xl py-4 text-white font-black text-sm transition-all duration-300">

                <i class="fa-solid fa-right-to-bracket ml-2"></i>
                تسجيل الدخول

            </button>

        </form>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
