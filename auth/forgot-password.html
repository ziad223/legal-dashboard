<!-- forgot-password.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نسيت كلمة المرور</title>
    <link rel="icon" type="image/png" href="../logo_legal.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="../js/tailwind-config.js"></script>
    <link rel="stylesheet" href="../css/main.css">
</head>

</head>

<body class="min-h-screen flex items-center justify-center p-6">

    <div class="card max-w-md w-full rounded-[35px] p-10 shadow-2xl">

        <div
            class="w-24 h-24 rounded-full bg-[#caa55d]/10 flex items-center justify-center mx-auto mb-6">

            <i class="fa-solid fa-key text-4xl text-[#caa55d]"></i>

        </div>

        <h2 class="text-3xl font-black text-center text-[#41684e]">
            نسيت كلمة المرور
        </h2>

        <p class="text-center text-gray-400 mt-3 text-sm font-bold leading-7">
            أدخل بريدك الإلكتروني وسنرسل لك رابط إعادة تعيين كلمة المرور
        </p>

        <form id="forgotForm" class="mt-8 space-y-5">

            <input type="email" id="email"
                placeholder="البريد الإلكتروني"
                class="input-style">

            <button
                class="w-full bg-[#caa55d] hover:bg-[#b89348] transition-all py-4 rounded-2xl text-white font-black">

                إرسال رابط الاستعادة

            </button>

        </form>

        <a href="login.html"
            class="flex items-center justify-center gap-2 mt-7 text-sm font-black text-[#41684e]">

            <i class="fa-solid fa-arrow-right"></i>
            العودة لتسجيل الدخول

        </a>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/forgot-password.js"></script>
</body>

</html>
