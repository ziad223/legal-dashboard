<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تفاصيل الموظف | Legal Technology</title>
  <link rel="icon" type="image/png" href="logo_legal.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <script src="js/auth.js"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/main.css">
</head>

<body class="min-h-screen bg-slate-100 text-slate-900">

  <div class="min-h-screen p-5 md:p-8">

    <div class="mb-6 flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
      <div>
        <a href="employees.html" class="mb-4 inline-flex items-center gap-2 rounded-2xl bg-white px-5 py-3 text-sm font-black text-legalGreen shadow-card transition hover:bg-legalGold hover:text-white">
          <i class="fa-solid fa-arrow-right"></i>
          رجوع لقائمة الموظفين
        </a>

        <h1 class="text-3xl font-black md:text-4xl">تفاصيل الموظف</h1>
        <p class="mt-2 text-sm font-bold text-slate-500">عرض كامل لبيانات الموظف وصلاحياته في النظام.</p>
      </div>

      <img src="logo_legal.png" class="h-16 w-16 rounded-2xl bg-white object-contain p-2 shadow-card" alt="Logo">
    </div>

    <section class="overflow-hidden rounded-[34px] bg-white shadow-card">

      <div class="relative bg-gradient-to-l from-legalGreen to-legalGreenDark p-7 text-white">
        <div class="absolute inset-0 opacity-10">
          <div class="h-full w-full bg-[url('https://images.unsplash.com/photo-1589829545856-d10d557cf95f?q=80&w=1200&auto=format&fit=crop')] bg-cover bg-center"></div>
        </div>

        <div class="relative z-10 flex flex-col gap-5 md:flex-row md:items-center md:justify-between">
          <div class="flex items-center gap-4">
            <div class="grid h-20 w-20 place-items-center rounded-3xl bg-white/15 text-3xl shadow-lg">
              <i class="fa-solid fa-user-shield"></i>
            </div>

            <div>
              <p class="text-sm font-bold text-legalGold">ملف الموظف</p>
              <h2 id="empName" class="mt-1 text-3xl font-black">---</h2>
              <p id="empRoleText" class="mt-1 text-sm font-bold text-white/75">---</p>
            </div>
          </div>

          <span id="empStatusBadge" class="w-fit rounded-full bg-white/15 px-5 py-2 text-sm font-black text-white">
            ---
          </span>
        </div>
      </div>

      <div class="grid gap-5 p-6 md:grid-cols-3">
        <div class="rounded-[26px] bg-slate-50 p-5">
          <p class="text-xs font-black text-slate-400">رقم الهاتف</p>
          <h3 id="empPhone" class="mt-2 text-lg font-black">---</h3>
        </div>

        <div class="rounded-[26px] bg-slate-50 p-5">
          <p class="text-xs font-black text-slate-400">البريد الإلكتروني</p>
          <h3 id="empEmail" class="mt-2 text-lg font-black">---</h3>
        </div>

        <div class="rounded-[26px] bg-slate-50 p-5">
          <p class="text-xs font-black text-slate-400">تاريخ الانضمام</p>
          <h3 id="empJoined" class="mt-2 text-lg font-black">---</h3>
        </div>
      </div>

      <div class="border-t border-slate-100 p-6">
        <h3 class="mb-4 flex items-center gap-2 text-lg font-black">
          <i class="fa-solid fa-file-signature text-legalGold"></i>
          الصلاحيات المعينة
        </h3>

        <div class="rounded-[24px] bg-slate-50 p-5">
          <div class="flex items-center gap-3">
            <div class="grid h-10 w-10 place-items-center rounded-xl bg-blue-100 text-blue-600">
              <i class="fa-solid fa-key"></i>
            </div>
            <div>
              <p class="text-sm font-black text-slate-800" id="empRoleTitle">---</p>
              <p class="text-xs font-bold text-slate-500" id="empRoleDesc">---</p>
            </div>
          </div>
        </div>
      </div>

      <div class="border-t border-slate-100 p-6">
        <h3 class="mb-4 flex items-center gap-2 text-lg font-black">
          <i class="fa-solid fa-note-sticky text-legalGold"></i>
          ملاحظات الموظف
        </h3>

        <div id="empNotes" class="rounded-[24px] bg-slate-50 p-5 text-sm font-bold leading-8 text-slate-600">
          لا توجد ملاحظات.
        </div>
      </div>

    </section>
  </div>

  <script src="js/employee-details.js"></script>
</body>
</html>
